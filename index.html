<script>
/* =============== SOUND =============== */
let audioCtx;
function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
function playTone(freq,type,duration){ ensureAudio(); const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,audioCtx.currentTime); o.connect(g); g.connect(audioCtx.destination); o.start(); g.gain.setValueAtTime(0.5,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+duration); o.stop(audioCtx.currentTime+duration); }
function playCorrectSound(){ playTone(523.25,'sine',.1); setTimeout(()=>playTone(659.25,'sine',.15),100); setTimeout(()=>playTone(783.99,'sine',.3),250); }
function playWrongSound(){ playTone(250,'sawtooth',.3); setTimeout(()=>playTone(200,'sawtooth',.4),200); }
function playPopSound(){ playTone(880,'sine',.08); }

let cachedVoices = [];
function refreshVoices(){ try{ cachedVoices = window.speechSynthesis.getVoices() || []; }catch(e){} }
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  return cachedVoices.find(v=>/en-US/i.test(v.lang) && /Google|Samantha|Microsoft|Female|Zira/i.test(v.name))
      || cachedVoices.find(v=>/en-US/i.test(v.lang))
      || cachedVoices.find(v=>/^en/i.test(v.lang))
      || null;
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    // Small delay after cancel() improves reliability on Chrome/Android where an
    // immediate speak() call right after cancel() is sometimes silently dropped.
    setTimeout(()=>{
      // Appending a period helps single letters (e.g. "A") be read as the letter
      // name instead of being mistaken for the word "a" by some voices.
      const toSpeak = text.length===1 ? text+'.' : text;
      const u = new SpeechSynthesisUtterance(toSpeak);
      u.lang='en-US';
      u.rate=0.65;   // slower, easier for KG children to follow
      u.pitch=1.0;   // natural pitch = clearer than an exaggerated high pitch
      u.volume=1.0;  // maximum volume
      const voice = pickEnglishVoice();
      if(voice) u.voice = voice;
      window.speechSynthesis.speak(u);
    }, 60);
  }catch(e){}
}

/* =============== UTILS =============== */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function cyclePick(arr,n){ let out=[]; while(out.length<n){ out=out.concat(shuffle(arr)); } return out.slice(0,n); }
function pickDistractors(pool,correct,count){ const filtered=pool.filter(x=>x!==correct); return shuffle(filtered).slice(0,count); }
function applyEmojis(){ if(window.twemoji){ twemoji.parse(document.body,{folder:'svg',ext:'.svg'}); } }

/* =============== DRAG & DROP ENGINE (pointer events, mouse + touch) =============== */
function enableDrag(item, onDrop){
  item.classList.add('drag-tile');
  item.style.touchAction='none';
  item.addEventListener('pointerdown', (e)=>{
    if(item.disabled) return;
    const rect = item.getBoundingClientRect();
    const offsetX = e.clientX - rect.left, offsetY = e.clientY - rect.top;
    try{ item.setPointerCapture(e.pointerId); }catch(err){}
    item.classList.add('dragging');
    item.style.position='fixed';
    item.style.zIndex=1000;
    item.style.width=rect.width+'px';
    item.style.height=rect.height+'px';
    item.style.left=rect.left+'px';
    item.style.top=rect.top+'px';
    item.style.margin='0';

    function move(ev){
      item.style.left=(ev.clientX-offsetX)+'px';
      item.style.top=(ev.clientY-offsetY)+'px';
    }
    function up(ev){
      item.removeEventListener('pointermove', move);
      item.removeEventListener('pointerup', up);
      item.removeEventListener('pointercancel', up);
      item.classList.remove('dragging');
      const prevPE = item.style.pointerEvents;
      item.style.pointerEvents='none';
      const dropEl = document.elementFromPoint(ev.clientX, ev.clientY);
      item.style.pointerEvents=prevPE;
      const zone = dropEl ? dropEl.closest('[data-dropzone]') : null;
      const reset = ()=>{
        item.style.position=''; item.style.left=''; item.style.top='';
        item.style.width=''; item.style.height=''; item.style.zIndex=''; item.style.margin='';
      };
      onDrop(zone, item, reset);
    }
    item.addEventListener('pointermove', move);
    item.addEventListener('pointerup', up);
    item.addEventListener('pointercancel', up);
  });
}

  {w:'snail',emoji:'🐌'},{w:'apple',emoji:'🍎'},{w:'zebra',emoji:'🦓'},{w:'mouse',emoji:'🐭'},
  {w:'horse',emoji:'🐴'},{w:'sheep',emoji:'🐑'},{w:'tiger',emoji:'🐯'},{w:'rabbit',emoji:'🐰'},
  {w:'monkey',emoji:'🐒'},{w:'turtle',emoji:'🐢'},{w:'octopus',emoji:'🐙'},{w:'giraffe',emoji:'🦒'}
];
// Combined pool used for the First Letter Match game (needs varied starting letters)
const FIRST_LETTER_ITEMS = [
  ...CVC_WORDS,
  ...SPELL_WORDS,
  {w:'egg',emoji:'🥚'},{w:'eye',emoji:'👁️'},{w:'umbrella',emoji:'☂️'},{w:'orange',emoji:'🍊'},
  {w:'kite',emoji:'🪁'},{w:'queen',emoji:'👑'},{w:'watch',emoji:'⌚'},{w:'yoyo',emoji:'🪀'},
  {w:'juice',emoji:'🧃'},{w:'ice cream',emoji:'🍦'},{w:'nest',emoji:'🪺'},{w:'grapes',emoji:'🍇'}
];

/* =============== GAME GENERATORS =============== */
// 1. Balloon Pop (Numbers) - chase / rise
function genBalloonPop(){
  return cyclePick(NUMBERS,20).map(item=>{
    const opts = shuffle([String(item.n), ...pickDistractors(NUMBERS.map(x=>String(x.n)), String(item.n), 3)]);
    return { type:'chase', mode:'rise', theme:'balloon', prompt:`🎈 Pop the balloon with number <span class="text-orange-500">${item.n}</span>!`, target:String(item.n), options:opts, speakText:String(item.n) };
  });
}
// 2. Bubble Counting (Numbers) - production/counting task
function genBubbleCount(){
  return cyclePick(NUMBERS,20).map(item=>{
    return { type:'popcount', prompt:`🫧 Pop exactly <span class="text-orange-500">${item.n}</span> bubbles!`, target:item.n };
  });
}
// 3. Frog Number Hop (Numbers) - spatial number-line hop
function genFrogHop(){
  const modes=['direct','plus1','minus1'];
  return cyclePick(NUMBERS,20).map((item,idx)=>{
    const mode = modes[idx%3];
    let target, prompt;
    if(mode==='direct'){ target=item.n; prompt=`🐸 Help the frog hop to number <span class="text-emerald-600">${item.n}</span>!`; }
    else if(mode==='plus1'){ target = item.n<10 ? item.n+1 : item.n-1; prompt=`🐸 Hop to the number that is <b>one more</b> than ${item.n}!`; }
    else { target = item.n>1 ? item.n-1 : item.n+1; prompt=`🐸 Hop to the number that is <b>one less</b> than ${item.n}!`; }
    return { type:'numberline', prompt, target };
  });
}
// Count & Tap (Numbers) - mcq counting objects
function genCountTap(){
  return cyclePick(NUMBERS,20).map(item=>{
    const opts = shuffle([String(item.n), ...pickDistractors(NUMBERS.map(x=>String(x.n)), String(item.n), 3)]);
    return { type:'mcq', prompt:'How many stars do you see? ⭐', visual:`<div class="text-4xl md:text-6xl leading-relaxed max-w-xl mx-auto">${'⭐'.repeat(item.n)}</div>`, options:opts, correct:String(item.n) };
  });
}
// What Comes Next (Numbers) - mcq sequence
function genNumberSequence(){
  const starts = cyclePick([1,2,3,4,5,6,7],20);
  return starts.map(s=>{
    const seq = [s,s+1,s+2];
    const correct = String(s+3);
    const opts = shuffle([correct, ...pickDistractors(NUMBERS.map(x=>String(x.n)), correct, 3)]);
    return { type:'mcq', prompt:'What number comes next?', visual:`<div class="text-4xl md:text-6xl font-black text-teal-700 font-toon">${seq.join(' , ')} , <span class="text-orange-500">?</span></div>`, options:opts, correct };
  });
}
// Letter Hunt (Letters) - mcq find uppercase letter
function genLetterHunt(){
  return cyclePick(LETTER_POOL,20).map(L=>{
    const opts = shuffle([L, ...pickDistractors(LETTER_POOL, L, 3)]);
    return { type:'mcq', prompt:`🔎 Find the letter <span class="text-orange-500">${L}</span>`, visual:'', options:opts, correct:L };
  });
}
// Vowel or Consonant (Letters) - basket sort
function genVowelConsonant(){
  return cyclePick(LETTERS,20).map(l=>{
    return { type:'basket', prompt:'🧺 Is this letter a Vowel or a Consonant?', item:l.up, correct: l.vowel?'vowel':'consonant',
      baskets:[ {key:'vowel', label:'Vowel', icon:'🔴', color:'from-rose-400 to-rose-500'}, {key:'consonant', label:'Consonant', icon:'🔵', color:'from-sky-400 to-blue-500'} ] };
  });
}
// Letter Sounds (Letters) - mcq + speak (classic buttons)
function genLetterSoundsMCQ(){
  return cyclePick(LETTERS,20).map(l=>{
    const opts = shuffle([l.up, ...pickDistractors(LETTER_POOL, l.up, 3)]);
    return { type:'mcq', prompt:'🔊 Listen and tap the correct letter', visual:`<button onclick="speak('${l.up}')" class="btn-toon toon-shadow-sm bg-yellow-100 hover:bg-yellow-200 border-4 border-yellow-300 rounded-full px-8 py-4 text-3xl md:text-4xl font-black text-yellow-700 font-toon">🔊 Play Sound</button>`, options:opts, correct:l.up, speakText:l.up };
  });
}
// Falling Letters (Letters) - chase / fall, cloud theme
function genFallingLettersCloud(){
  return cyclePick(LETTER_POOL,20).map(L=>{
    const opts = shuffle([L, ...pickDistractors(LETTER_POOL, L, 3)]);
    return { type:'chase', mode:'fall', theme:'cloud', prompt:`☁️ Catch the letter <span class="text-sky-600">${L}</span> before it falls!`, target:L, options:opts, speakText:L };
  });
}
// Build the Word (CVC) - tap letters in order
function genBuildTapOrder(){
  return cyclePick(CVC_WORDS,20).map(item=>{
    const wordLetters = item.w.split('');
    const distractors = shuffle(LETTER_POOL.map(x=>x.toLowerCase()).filter(x=>!wordLetters.includes(x))).slice(0,2);
    const tiles = shuffle([...wordLetters, ...distractors]);
    return { type:'build', prompt:'🐝 Tap the letters in order to build the word!', word:item.w, emoji:item.emoji, tiles };
  });
}
// Listen & Choose (CVC) - mcq + speak, picture options
function genListenChoose(){
  return cyclePick(CVC_WORDS,20).map(item=>{
    const distractors = pickDistractors(CVC_WORDS.map(x=>x.emoji), item.emoji, 3);
    const opts = shuffle([item.emoji, ...distractors]);
    return { type:'mcq', prompt:'👂 Listen carefully and tap the correct picture', visual:`<button onclick="speak('${item.w}')" class="btn-toon toon-shadow-sm bg-yellow-100 hover:bg-yellow-200 border-4 border-yellow-300 rounded-full px-8 py-4 text-3xl md:text-4xl font-black text-yellow-700 font-toon">🔊 Play Word</button>`, options:opts, correct:item.emoji, speakText:item.w, isEmoji:true };
  });
}
// Spell the Word (Letters) - full alphabet keyboard, tap letters in order
function genSpellWord(){
  return cyclePick(SPELL_WORDS,20).map(item=>{
    return { type:'spell', prompt:'⌨️ Spell the word! Tap the letters in order.', word:item.w, emoji:item.emoji };
  });
}
// First Letter Match (Letters) - drag the starting letter of each picture from an A-Z bank
function genFirstLetterMatch(){
  return cyclePick([1,2,3,4,5],20).map(()=>{
    const pool = shuffle(FIRST_LETTER_ITEMS);
    const picked = [];
    const usedLetters = new Set();
    for(const item of pool){
      const L = item.w.trim()[0].toUpperCase();
      if(!usedLetters.has(L)){ usedLetters.add(L); picked.push(item); }
      if(picked.length===5) break;
    }
    return { type:'firstLetter', prompt:'🔤 Drag the letter that matches the first sound of each picture!', items:picked };
  });
}
// 5. Missing Letter (Letters) - drag tile into blank
function genMissingLetter(){
  const starts = cyclePick(Array.from({length:22},(_,i)=>i),20);
  return starts.map(i=>{
    const seq = LETTER_POOL.slice(i,i+5);
    const correct = seq[2];
    const display = seq.map((l,idx)=> idx===2 ? '_' : l);
    const distractors = pickDistractors(LETTER_POOL, correct, 2);
    const tiles = shuffle([correct, ...distractors]);
    return { type:'dragBlank', prompt:'🧩 Drag the missing letter into its place!', display, correct, tiles };
  });
}
// 6. Falling Leaves (Letters) - chase / fall
function genFallingLeaves(){
  return cyclePick(LETTER_POOL,20).map(L=>{
    const opts = shuffle([L, ...pickDistractors(LETTER_POOL, L, 3)]);
    return { type:'chase', mode:'fall', theme:'leaf', prompt:`🍃 Catch the letter <span class="text-emerald-600">${L}</span> before it falls!`, target:L, options:opts, speakText:L };
  });
}
// 7. Sound Keys (Letters) - phonics, piano-key style
function genSoundKeys(){
  return cyclePick(LETTERS,20).map(l=>{
    const opts=shuffle([l.up,...pickDistractors(LETTER_POOL,l.up,3)]);
    return { type:'keys', prompt:'🎹 Listen and press the correct key!', options:opts, correct:l.up, speakText:l.up };
  });
}
// 8. Word Builder (CVC) - drag letters into slots
function genWordBuilderDrag(){
  return cyclePick(CVC_WORDS,20).map(item=>{
    const wordLetters = item.w.split('');
    const distractors = shuffle(LETTER_POOL.map(x=>x.toLowerCase()).filter(x=>!wordLetters.includes(x))).slice(0,2);
    const tiles = shuffle([...wordLetters, ...distractors]);
    return { type:'dragBuild', prompt:'🧵 Drag the letters to build the word!', word:item.w, emoji:item.emoji, tiles };
  });
}
// 9. Picture Match (CVC) - drag picture onto matching word
function genPictureMatch(){
  return cyclePick([1,2,3,4,5],20).map(()=>{
    const words = shuffle(CVC_WORDS).slice(0,3);
    return { type:'dragMatch', prompt:'🖼️ Drag each picture to its matching word!', pairs:words };
  });
}
// 10. Memory Genius (CVC) - flip cards
function genMemory(){
  return cyclePick([1,2,3,4,5],20).map(()=>{
    const words = shuffle(CVC_WORDS).slice(0,3);
    return { type:'memory', prompt:'🧠 Find all the matching pairs!', pairs:words };
  });
}

/* =============== STATE =============== */
let currentGame=null, currentQuestions=[], currentQuestionIndex=0, score=0;

/* =============== APP INIT =============== */
function initApp(){
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML='';
  const rotations=[-2,2,-1,3,-3,1,2,-2,1,-1];
  GAMES.forEach((g,i)=>{
    const card = document.createElement('button');
    card.style.transform = `rotate(${rotations[i%rotations.length]}deg)`;
    card.className = `btn-toon toon-shadow bg-gradient-to-br ${g.color} rounded-[2rem] p-4 md:p-6 border-4 border-white flex flex-col items-center justify-center gap-2 text-white font-toon`;
    card.innerHTML = `<div class="text-5xl md:text-6xl wiggle">${g.icon}</div><div class="text-base md:text-xl font-black text-center leading-tight">${g.title}</div><div class="text-xs md:text-sm font-bold bg-white/25 rounded-full px-3 py-1">${g.topic}</div>`;
    card.onclick = ()=>startGame(g.key);
    grid.appendChild(card);
  });
  applyEmojis();
}

function showMainMenu(){
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('mainMenu').classList.remove('hidden');
  document.getElementById('answerArea').innerHTML='';
  applyEmojis();
}

function startGame(key){
  const g = GAMES.find(x=>x.key===key);
  currentGame = g;
  currentQuestions = g.gen();
  currentQuestionIndex = 0;
  score = 0;
  document.getElementById('gameTitle').innerText = g.icon+' '+g.title;
  document.getElementById('scoreDisplay').innerText = score;
  document.getElementById('qTotal').innerText = currentQuestions.length;
  document.getElementById('mainMenu').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');
  loadQuestion();
}

function loadQuestion(){
  if(currentQuestionIndex >= currentQuestions.length){ endGame(); return; }
  const q = currentQuestions[currentQuestionIndex];
  document.getElementById('qCurrent').innerText = currentQuestionIndex+1;
  const progress = (currentQuestionIndex/currentQuestions.length)*100;
  document.getElementById('progressBar').style.width = progress+'%';
  document.getElementById('questionText').innerHTML = q.prompt || '';
  document.getElementById('questionVisual').innerHTML = q.visual || '';
  const area = document.getElementById('answerArea');
  area.innerHTML='';
  area.removeAttribute('data-locked');
  area.style.pointerEvents='auto';

  if(q.type==='mcq') renderMCQ(q,area);
  else if(q.type==='basket') renderBasket(q,area);
  else if(q.type==='build') renderBuild(q,area);
  else if(q.type==='chase') renderChase(q,area);
  else if(q.type==='popcount') renderPopCount(q,area);
  else if(q.type==='numberline') renderNumberline(q,area);
  else if(q.type==='dragBlank') renderDragBlank(q,area);
  else if(q.type==='spell') renderSpell(q,area);
  else if(q.type==='firstLetter') renderFirstLetter(q,area);
  else if(q.type==='keys') renderKeys(q,area);
  else if(q.type==='dragBuild') renderDragBuild(q,area);
  else if(q.type==='dragMatch') renderDragMatch(q,area);
  else if(q.type==='memory') renderMemory(q,area);

  applyEmojis();
  if(q.speakText) setTimeout(()=>speak(q.speakText), 350);
}

function nextQuestion(){ currentQuestionIndex++; loadQuestion(); }
function awardPoint(){ score++; document.getElementById('scoreDisplay').innerText=score; }

/* ===== Center feedback ===== */
function showCenterFeedback(isCorrect){
  const overlay = document.getElementById('centerScreenFeedback');
  const icon = document.getElementById('centerIcon');
  overlay.classList.remove('hidden'); overlay.classList.add('flex');
  if(isCorrect){
    icon.innerHTML='✅';
    icon.className="text-[8rem] sm:text-[12rem] md:text-[20rem] lg:text-[25rem] drop-shadow-2xl transform scale-0 transition-transform duration-300 ease-out flex items-center justify-center pop-out";
    playCorrectSound();
  } else {
    icon.innerHTML='❌';
    icon.className="text-[8rem] sm:text-[12rem] md:text-[20rem] lg:text-[25rem] drop-shadow-2xl transform scale-0 transition-transform duration-300 ease-out flex items-center justify-center shake text-red-500";
    playWrongSound();
  }
  applyEmojis();
  setTimeout(()=>{
    icon.classList.remove('pop-out','shake'); icon.classList.add('scale-0');
    setTimeout(()=>{ overlay.classList.add('hidden'); overlay.classList.remove('flex'); },300);
  },900);
}

/* ===== Chase engine (falling / rising catch) ===== */
const CHASE_THEMES = {
  balloon: { bg:'bg-gradient-to-b from-orange-100 to-rose-50', items:['from-pink-400 to-rose-500','from-purple-400 to-violet-500','from-amber-400 to-orange-500','from-sky-400 to-blue-500'] },
  leaf:    { bg:'bg-gradient-to-b from-lime-100 to-emerald-50', items:['from-lime-300 to-green-500','from-emerald-300 to-teal-500'] },
  cloud:   { bg:'bg-gradient-to-b from-sky-100 to-blue-50', items:['from-sky-300 to-blue-500','from-indigo-300 to-blue-600'] }
};
function renderChase(q, container){
  container.className = "w-full max-w-3xl mx-auto";
  const theme = CHASE_THEMES[q.theme] || CHASE_THEMES.balloon;
  container.innerHTML = `<div id="chaseArena" class="arena ${theme.bg} rounded-[2rem] border-4 border-teal-100 w-full h-[360px] md:h-[440px]"></div>`;
  const arena = document.getElementById('chaseArena');
  let resolved = false;
  const positions = [8,30,52,74];
  const shuffledPos = shuffle(positions);
  q.options.forEach((opt,i)=>{
    const isTarget = opt===q.target;
    const el = document.createElement('button');
    el.className = `chase-item btn-toon toon-shadow-sm ${q.mode==='rise' ? 'anim-rise' : 'anim-fall'} rounded-full font-black flex items-center justify-center border-4 border-white text-2xl md:text-4xl font-toon bg-gradient-to-b text-white`;
    const size = window.innerWidth < 768 ? 62 : 84;
    el.style.width = size+'px'; el.style.height = size+'px';
    el.style.left = shuffledPos[i]+'%';
    if(q.mode==='rise'){ el.style.bottom='-90px'; } else { el.style.top='-90px'; }
    const gradClasses = theme.items[i % theme.items.length].split(' ');
    el.classList.add(...gradClasses);
    el.innerText = opt;
    const duration = 4 + Math.random()*1.5;
    el.style.animationDuration = duration.toFixed(2)+'s';
    el.style.animationDelay = (i*0.25).toFixed(2)+'s';
    el.onclick = ()=>{
      if(resolved) return;
      if(isTarget){ resolved=true; el.style.animationPlayState='paused'; finishChase(true); }
      else { el.classList.add('shake'); playWrongSound(); setTimeout(()=>{ el.remove(); },300); }
    };
    if(isTarget){ el.addEventListener('animationend', ()=>{ if(!resolved){ resolved=true; finishChase(false); } }); }
    arena.appendChild(el);
  });
}
function finishChase(isCorrect){
  document.getElementById('answerArea').style.pointerEvents='none';
  showCenterFeedback(isCorrect);
  setTimeout(()=>{ if(isCorrect) awardPoint(); document.getElementById('answerArea').style.pointerEvents='auto'; nextQuestion(); },1100);
}

/* ===== 2. Bubble Counting engine ===== */
function renderPopCount(q, container){
  container.className = "w-full max-w-2xl mx-auto";
  container.innerHTML = `<div class="text-xl md:text-2xl font-black text-teal-700 mb-3 font-toon">Popped: <span id="poppedCount">0</span> / ${q.target}</div>
    <div id="bubbleArena" class="relative w-full h-[320px] md:h-[400px] bg-gradient-to-b from-cyan-100 to-blue-50 rounded-[2rem] border-4 border-cyan-200 overflow-hidden"></div>`;
  const arena = document.getElementById('bubbleArena');
  const total = Math.min(q.target + randInt(4,6), 16);
  let popped = 0;
  for(let i=0;i<total;i++){
    const b = document.createElement('button');
    b.className = "absolute btn-toon rounded-full bg-gradient-to-br from-sky-300 to-blue-400 border-4 border-white toon-shadow-sm";
    const size = window.innerWidth<768?50:66;
    b.style.width=size+'px'; b.style.height=size+'px';
    b.style.left = randInt(4,86)+'%'; b.style.top = randInt(4,76)+'%';
    b.onclick = ()=>{
      if(b.disabled || popped>=q.target) return;
      b.disabled = true;
      b.style.transform='scale(0)'; b.style.transition='transform .25s';
      playPopSound();
      popped++;
      document.getElementById('poppedCount').innerText = popped;
      setTimeout(()=>b.remove(),250);
      if(popped===q.target){
        arena.querySelectorAll('button').forEach(x=>x.disabled=true);
        showCenterFeedback(true);
        setTimeout(()=>{ awardPoint(); nextQuestion(); },900);
      }
    };
    arena.appendChild(b);
  }
}

/* ===== 3. Frog Number Hop engine ===== */
function renderNumberline(q, container){
  container.className = "w-full max-w-2xl mx-auto";
  container.innerHTML = `<div id="pond" class="relative w-full h-[300px] md:h-[360px] bg-gradient-to-b from-emerald-100 to-teal-50 rounded-[2rem] border-4 border-emerald-200 overflow-hidden"></div>`;
  const pond = document.getElementById('pond');
  const pads = shuffle(NUMBERS.map(x=>x.n));
  const cols = 5;
  pads.forEach((n,i)=>{
    const leftPct = 8 + (i%cols)*20;
    const topPct = 14 + Math.floor(i/cols)*46;
    const pad = document.createElement('button');
    pad.className = "absolute btn-toon toon-shadow-sm rounded-full bg-gradient-to-br from-green-300 to-green-500 border-4 border-white text-white font-black text-xl md:text-3xl flex items-center justify-center font-toon";
    const size = window.innerWidth<768?56:76;
    pad.style.width=size+'px'; pad.style.height=size+'px';
    pad.style.left=leftPct+'%'; pad.style.top=topPct+'%';
    pad.innerText = n;
    pad.onclick = ()=>{
      if(pond.dataset.locked==='1') return;
      pond.dataset.locked='1';
      const isCorrect = n===q.target;
      if(isCorrect) pad.classList.add('ring-4','ring-yellow-300'); else pad.classList.add('shake');
      showCenterFeedback(isCorrect);
      setTimeout(()=>{ if(isCorrect) awardPoint(); nextQuestion(); },1000);
    };
    pond.appendChild(pad);
  });
}

/* ===== Generic MCQ engine ===== */
function renderMCQ(q, container){
  const gridCols = q.options.length===2 ? "grid-cols-1 sm:grid-cols-2" : "grid-cols-2 md:grid-cols-2 lg:grid-cols-4";
  container.className = `grid ${gridCols} gap-4 md:gap-6 w-full max-w-4xl mx-auto`;
  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    const bigEmoji = q.isEmoji;
    btn.className = `btn-toon toon-shadow-sm bg-teal-50 hover:bg-teal-100 text-teal-900 font-black py-6 md:py-8 px-2 md:px-4 rounded-[1.5rem] border-4 border-teal-200 flex items-center justify-center text-center relative overflow-hidden leading-snug break-words h-full min-h-[100px] font-toon ${bigEmoji ? 'text-5xl md:text-7xl' : 'text-2xl sm:text-3xl md:text-4xl'}`;
    btn.innerHTML = opt;
    btn.onclick = ()=>{ if(container.style.pointerEvents==='none') return; handleMCQAnswer(opt===q.correct, btn); };
    container.appendChild(btn);
  });
}
function handleMCQAnswer(isCorrect, element){
  const container = document.getElementById('answerArea');
  container.style.pointerEvents='none';
  if(isCorrect){
    element.classList.add('bg-green-400','text-white','border-green-600');
    element.insertAdjacentHTML('beforeend','<div class="absolute inset-0 flex items-center justify-center bg-white bg-opacity-60 rounded-[inherit] text-5xl md:text-7xl pop-out z-10">✅</div>');
  } else {
    element.classList.add('bg-red-400','text-white','border-red-600');
    element.insertAdjacentHTML('beforeend','<div class="absolute inset-0 flex items-center justify-center bg-white bg-opacity-60 rounded-[inherit] text-5xl md:text-7xl pop-out z-10">❌</div>');
  }
  showCenterFeedback(isCorrect);
  setTimeout(()=>{
    if(isCorrect){ awardPoint(); container.style.pointerEvents='auto'; nextQuestion(); }
    else { element.classList.remove('bg-red-400','text-white','border-red-600'); element.querySelectorAll('.pop-out').forEach(e=>e.remove()); container.style.pointerEvents='auto'; }
  },1100);
}

/* ===== Basket (sort) engine ===== */
function renderBasket(q, container){
  container.className = "w-full max-w-2xl mx-auto flex flex-col items-center gap-8";
  container.innerHTML = `
    <div id="basketItem" class="toon-shadow text-6xl md:text-8xl font-black text-violet-700 bg-violet-50 border-4 border-violet-200 rounded-[2rem] w-32 h-32 md:w-48 md:h-48 flex items-center justify-center font-toon">${q.item}</div>
    <div class="grid grid-cols-2 gap-6 md:gap-10 w-full">
      ${q.baskets.map(b=>`<button data-key="${b.key}" class="basket-btn btn-toon toon-shadow bg-gradient-to-br ${b.color} text-white font-black py-6 md:py-10 rounded-[2rem] text-xl md:text-3xl border-4 border-white flex flex-col items-center gap-2 font-toon"><span class="text-4xl md:text-6xl">${b.icon}</span>${b.label}</button>`).join('')}
    </div>`;
  container.querySelectorAll('.basket-btn').forEach(btn=>{

      container.dataset.locked='1';
      const isCorrect = btn.dataset.key===q.correct;
      if(isCorrect) btn.classList.add('ring-4','ring-yellow-300','scale-105'); else btn.classList.add('shake');
      showCenterFeedback(isCorrect);
      setTimeout(()=>{ if(isCorrect) awardPoint(); nextQuestion(); },1100);

}

/* ===== Word Builder (tap-in-order) engine ===== */
function renderBuild(q, container){
  container.className = "w-full max-w-2xl mx-auto flex flex-col items-center gap-8";
  const slotsHtml = q.word.split('').map((_,i)=>`<div id="slot-${i}" class="w-14 h-14 md:w-20 md:h-20 rounded-2xl bg-amber-50 border-4 border-dashed border-amber-300 flex items-center justify-center text-2xl md:text-4xl font-black text-amber-700 font-toon"></div>`).join('');
  container.innerHTML = `<div class="text-6xl md:text-8xl">${q.emoji}</div><div class="flex gap-2 md:gap-4">${slotsHtml}</div><div id="tilesRow" class="flex flex-wrap justify-center gap-3 md:gap-5 mt-2"></div>`;
  const tilesRow = document.getElementById('tilesRow');
  let filled = 0;
  q.tiles.forEach(letter=>{
    const btn = document.createElement('button');
    btn.className = "btn-toon toon-shadow-sm bg-amber-100 hover:bg-amber-200 border-4 border-amber-300 rounded-2xl w-14 h-14 md:w-20 md:h-20 text-2xl md:text-4xl font-black text-amber-800 uppercase font-toon";
    btn.innerText = letter;
    btn.onclick = ()=>{
      if(btn.disabled) return;
      const needed = q.word[filled];
      if(letter===needed){
        const slot = document.getElementById('slot-'+filled);
        slot.innerText = letter.toUpperCase();
        slot.classList.remove('border-dashed','border-amber-300','bg-amber-50');
        slot.classList.add('bg-green-100','border-green-400');
        btn.disabled = true; btn.classList.add('opacity-30');
        filled++; playPopSound();
        if(filled===q.word.length){
          showCenterFeedback(true);
          setTimeout(()=>{ awardPoint(); nextQuestion(); },1100);
        }
      } else { btn.classList.add('shake'); playWrongSound(); setTimeout(()=>btn.classList.remove('shake'),500); }
    };
    tilesRow.appendChild(btn);
  });
}

/* ===== Spell the Word (full A-Z keyboard) engine ===== */
function renderSpell(q, container){
  container.className = "w-full max-w-2xl mx-auto flex flex-col items-center gap-5";
  const slotsHtml = q.word.split('').map((_,i)=>`<div id="sslot-${i}" class="w-10 h-12 md:w-14 md:h-16 rounded-xl bg-indigo-50 border-4 border-dashed border-indigo-400 flex items-center justify-center text-xl md:text-3xl font-black text-indigo-700 font-toon"></div>`).join('');
  container.innerHTML = `
    <div class="text-6xl md:text-8xl">${q.emoji}</div>
    <div class="flex flex-wrap justify-center gap-1.5 md:gap-2">${slotsHtml}</div>
    <div id="spellKeyboard" class="flex flex-wrap justify-center gap-1.5 md:gap-2 max-w-2xl mt-2"></div>`;
  const kb = document.getElementById('spellKeyboard');
  let filled = 0;
  LETTER_POOL.forEach(L=>{
    const key = document.createElement('button');
    key.className = "btn-toon toon-shadow-sm bg-white hover:bg-indigo-50 border-4 border-indigo-200 rounded-xl w-9 h-9 sm:w-10 sm:h-10 md:w-12 md:h-12 flex items-center justify-center text-base md:text-xl font-black text-indigo-800 font-toon";
    key.innerText = L;
    key.onclick = ()=>{
      if(key.disabled) return;
      const needed = q.word[filled].toUpperCase();
      if(L===needed){
        const slot = document.getElementById('sslot-'+filled);
        slot.innerText = L;
        slot.classList.remove('border-dashed','border-indigo-400','bg-indigo-50');
        slot.classList.add('bg-green-100','border-green-400');
        key.disabled = true; key.classList.add('opacity-30');
        filled++; playPopSound();
        if(filled===q.word.length){
          kb.querySelectorAll('button').forEach(b=>b.disabled=true);
          showCenterFeedback(true);
          setTimeout(()=>{ awardPoint(); nextQuestion(); },1100);
        }
      } else {
        key.classList.add('shake'); playWrongSound();
        setTimeout(()=>key.classList.remove('shake'),500);
      }
    };
    kb.appendChild(key);
  });
}

/* ===== First Letter Match (drag A-Z bank to each picture) engine ===== */
function renderFirstLetter(q, container){
  container.className = "w-full max-w-3xl mx-auto flex flex-col items-center gap-6";
  const picsHtml = q.items.map((item,i)=>`
    <div class="flex flex-col items-center gap-2">
      <div id="flbox-${i}" data-dropzone="fl" data-idx="${i}" class="w-14 h-14 md:w-20 md:h-20 rounded-2xl bg-teal-50 border-4 border-dashed border-teal-400 flex items-center justify-center text-2xl md:text-4xl font-black text-teal-700 font-toon"></div>
      <div class="text-4xl md:text-6xl">${item.emoji}</div>
    </div>`).join('');
  container.innerHTML = `
    <div class="flex flex-wrap justify-center gap-4 md:gap-8">${picsHtml}</div>
    <div id="flKeyboard" class="flex flex-wrap justify-center gap-1.5 md:gap-2 max-w-2xl mt-2"></div>`;
  const kb = document.getElementById('flKeyboard');
  let matchedCount = 0;
  const neededLetters = q.items.map(it=>it.w.trim()[0].toUpperCase());
  LETTER_POOL.forEach(L=>{
    const tile = document.createElement('div');
    tile.className = "btn-toon toon-shadow-sm bg-white border-4 border-orange-200 rounded-xl w-9 h-9 sm:w-10 sm:h-10 md:w-12 md:h-12 flex items-center justify-center text-base md:text-xl font-black text-orange-700 font-toon";
    tile.innerText = L; tile.dataset.letter = L;
    enableDrag(tile, (zone,item,reset)=>{
      if(zone && zone.dataset.dropzone==='fl'){
        const idx = parseInt(zone.dataset.idx,10);
        if(!zone.classList.contains('filled') && neededLetters[idx]===item.dataset.letter){
          zone.classList.add('filled','bg-green-100','border-green-400');
          zone.classList.remove('border-dashed','border-teal-400','bg-teal-50');
          zone.innerText = item.dataset.letter;
          item.remove();
          matchedCount++; playCorrectSound();
          if(matchedCount===q.items.length){
            showCenterFeedback(true);
            setTimeout(()=>{ awardPoint(); nextQuestion(); },1100);
          }
        } else {
          reset(); item.classList.add('shake'); playWrongSound();
          setTimeout(()=>item.classList.remove('shake'),500);
        }
      } else { reset(); }
    });
    kb.appendChild(tile);
  });
}

function renderDragBlank(q, container){

    <div class="flex justify-center gap-2 md:gap-4 mb-8 flex-wrap">

        : `<div class="w-14 h-14 md:w-20 md:h-20 rounded-2xl bg-white border-4 border-violet-200 toon-shadow-sm flex items-center justify-center text-2xl md:text-4xl font-black text-violet-800 font-toon">${ch}</div>`

          slot.classList.add('bg-green-100','border-green-400');

          showCenterFeedback(true);
          setTimeout(()=>{ awardPoint(); nextQuestion(); },900);
        } else {
          reset(); item.classList.add('shake'); playWrongSound();
          setTimeout(()=>item.classList.remove('shake'),500);
        }
      } else { reset(); }

}

/* ===== 9. Picture Match (drag) engine ===== */
function renderDragMatch(q, container){
  container.className = "w-full max-w-2xl mx-auto";
  container.innerHTML = `<div class="flex justify-center gap-8 md:gap-16"><div id="leftCol" class="flex flex-col gap-4 md:gap-6"></div><div id="rightCol" class="flex flex-col gap-4 md:gap-6"></div></div>`;
  const leftCol = document.getElementById('leftCol');
  const rightCol = document.getElementById('rightCol');
  const rightItems = shuffle(q.pairs);
  const leftItems = shuffle(q.pairs);
  let matchedCount = 0;

  rightItems.forEach(p=>{
    const zone = document.createElement('div');
    zone.className = "toon-shadow-sm bg-white border-4 border-dashed border-purple-300 rounded-2xl w-28 h-16 md:w-40 md:h-24 flex items-center justify-center text-lg md:text-2xl font-black text-purple-700 capitalize font-toon";
    zone.dataset.dropzone = 'word'; zone.dataset.val = p.w;
    zone.innerText = p.w;
    rightCol.appendChild(zone);
  });
  leftItems.forEach(p=>{
    const card = document.createElement('div');
    card.className = "btn-toon toon-shadow-sm bg-pink-100 border-4 border-pink-300 rounded-2xl w-24 h-16 md:w-32 md:h-24 flex items-center justify-center text-4xl md:text-5xl";
    card.innerText = p.emoji; card.dataset.val = p.w;
    enableDrag(card, (zone,item,reset)=>{
      if(zone && zone.dataset.dropzone==='word'){
        if(zone.dataset.val===item.dataset.val && !zone.classList.contains('matched')){
          zone.classList.add('matched'); zone.classList.remove('border-dashed','border-purple-300');
          zone.classList.add('bg-green-100','border-green-400');
          zone.innerHTML = zone.dataset.val + ' ✅';
          item.remove();
          matchedCount++; playCorrectSound();
          if(matchedCount===q.pairs.length){
            showCenterFeedback(true);
            setTimeout(()=>{ awardPoint(); nextQuestion(); },900);
          }
        } else {
          reset(); item.classList.add('shake'); playWrongSound();
          setTimeout(()=>item.classList.remove('shake'),500);
        }
      } else { reset(); }
    });
    leftCol.appendChild(card);
  });
}

/* ===== 10. Memory engine ===== */
function renderMemory(q, container){
  container.className = "w-full max-w-2xl mx-auto";
  let cards = [];
  q.pairs.forEach(p=>{ cards.push({val:p.w, display:p.emoji, kind:'emoji'}); cards.push({val:p.w, display:p.w, kind:'word'}); });
  cards = shuffle(cards);
  container.innerHTML = `<div id="memGrid" class="grid grid-cols-3 gap-3 md:gap-5"></div>`;
  const grid = document.getElementById('memGrid');
  let firstIdx=null, lock=false, matchedCount=0;
  cards.forEach((c,idx)=>{
    const card = document.createElement('div');
    card.className = "flip-card w-full h-24 md:h-32 cursor-pointer";
    card.innerHTML = `<div class="flip-inner w-full h-full">
        <div class="flip-face toon-shadow-sm bg-gradient-to-br from-teal-400 to-cyan-500 text-white text-3xl md:text-5xl">❓</div>
        <div class="flip-face flip-back toon-shadow-sm bg-white border-4 border-teal-200 ${c.kind==='emoji' ? 'text-4xl md:text-6xl' : 'text-xl md:text-3xl font-black text-teal-700 capitalize font-toon'}">${c.display}</div>
      </div>`;
    card.onclick = ()=>{
      if(lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      playPopSound();
      if(firstIdx===null){ firstIdx=idx; }
      else {
        lock = true;
        const firstCard = grid.children[firstIdx];
        const isMatch = cards[firstIdx].val===cards[idx].val;
        setTimeout(()=>{
          if(isMatch){
            firstCard.classList.add('matched'); card.classList.add('matched');
            firstCard.querySelector('.flip-back').classList.add('bg-green-100','border-green-400');
            card.querySelector('.flip-back').classList.add('bg-green-100','border-green-400');
            playCorrectSound();
            matchedCount++;
            if(matchedCount===q.pairs.length){
              setTimeout(()=>{ awardPoint(); nextQuestion(); },800);
            }
          } else {
            playWrongSound();
            firstCard.classList.remove('flipped'); card.classList.remove('flipped');
          }
          firstIdx=null; lock=false;
        }, isMatch?400:900);
      }
    };
    grid.appendChild(card);
  });
}
